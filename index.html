<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Proactive Wire Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800&family=Barlow:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1a1a1e;
    --accent: #fdb826;
    --accent2: #2d2d2d;
    --text: #1a1a1a;
    --dim: #6b7280;
    --panel: #2d2d2d;
    --border: rgba(255, 255, 255, 0.15);
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  .overlay-root {
    width: 1920px;
    height: 1080px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: center center;
    background: var(--bg);
    font-family: 'Barlow', sans-serif;
    color: var(--text);
  }

  /* BG PATTERN */
  .bg-pattern {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }

  .bg-pattern-inner {
    position: absolute;
    top: -100%;
    left: -100%;
    width: 300%;
    height: 300%;
  }

  .bg-pattern-scroll {
    display: inline-flex;
    white-space: nowrap;
    animation: bgScroll var(--bg-speed, 60s) linear infinite;
  }

  .bg-pattern-scroll.reverse {
    animation-direction: reverse;
  }

  @keyframes bgScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  .bg-pattern-row {
    white-space: nowrap;
    line-height: 1;
  }

  .bg-pattern-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    letter-spacing: 12px;
    text-transform: uppercase;
    display: inline;
    padding: 0 40px;
  }

  /* TOP BAR */
  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 72px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 30px;
    gap: 24px;
    z-index: 20;
  }

  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 27px;
    letter-spacing: 4px;
    text-transform: uppercase;
    white-space: nowrap;
    color: #ffffff;
  }
  .logo span { color: var(--accent); }

  .divider {
    width: 1px;
    height: 30px;
    background: rgba(255, 255, 255, 0.15);
  }

  .scene-badge {
    background: var(--accent);
    color: #1a1a1a;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
    padding: 6px 18px;
    border-radius: 3px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #f04060;
    white-space: nowrap;
  }
  .live-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #f04060;
    box-shadow: 0 0 8px rgba(240, 64, 96, 0.6);
  }

  /* CLOCKS */
  .top-clocks {
    margin-left: auto;
    display: flex;
    gap: 6px;
  }

  .clock-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 18px;
    border-left: 1px solid var(--border);
  }
  .clock-item:first-child { border-left: none; }

  .clock-city {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 2px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
  }
  .clock-time {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #ffffff;
    display: flex;
    gap: 0;
  }

  .clock-digit {
    display: inline-block;
    width: 0.6em;
    text-align: center;
    overflow: hidden;
    height: 1.2em;
    line-height: 1.2em;
    position: relative;
  }

  .clock-digit-inner {
    display: block;
  }

  .clock-colon {
    width: 0.3em;
    text-align: center;
    opacity: 0.5;
  }

  /* TICKER STRIP */
  .ticker-strip {
    position: absolute;
    bottom: 35px; left: 0; right: 0;
    height: 45px;
    background: var(--panel);
    display: flex;
    align-items: center;
    overflow: hidden;
    z-index: 20;
  }

  .ticker-strip-label {
    background: var(--accent);
    color: #1a1a1a;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    padding: 0 18px;
    height: 100%;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    white-space: nowrap;
    z-index: 2;
    position: relative;
  }

  .ticker-scroll-wrapper {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  .ticker-scroll {
    display: inline-flex;
    white-space: nowrap;
    will-change: transform;
  }

  .ticker-item {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
    padding: 0 24px;
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .ticker-symbol {
    color: var(--accent);
    font-weight: 700;
  }

  .ticker-price {
    font-variant-numeric: tabular-nums;
  }

  .ticker-change {
    font-variant-numeric: tabular-nums;
  }

  .ticker-flash {
    border-radius: 3px;
    padding: 0 4px;
    margin: 0 -4px;
  }

  .ticker-up { color: #22c55e; }
  .ticker-down { color: #ef4444; }

  /* FOOTER BAR */
  .footer-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 36px;
    background: #3a3a3a;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 30px;
    z-index: 20;
  }

  .footer-hashtag {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.6);
    letter-spacing: 2px;
    text-transform: uppercase;
    padding-right: 20px;
    border-right: 1px solid rgba(255, 255, 255, 0.1);
    white-space: nowrap;
  }

  .footer-ctas {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .footer-cta {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 20px;
    white-space: nowrap;
  }

  .footer-cta-sep {
    color: rgba(255, 255, 255, 0.15);
    font-size: 10px;
  }

  .footer-cta-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.4);
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="overlay-root" id="overlayRoot">

<div class="bg-pattern">
  <div class="bg-pattern-inner" id="bgPattern"></div>
</div>

<div class="top-bar">
  <div class="logo">PROACTIVE <span>WIRE</span></div>
  <div class="divider"></div>
  <div class="scene-badge" id="sceneBadge">LIVE</div>
  <div class="live-badge"><div class="live-dot" id="liveDot"></div>LIVE</div>
  <div class="top-clocks" id="clocks"></div>
</div>

<div class="ticker-strip" id="tickerStrip">
  <div class="ticker-strip-label">MARKETS</div>
  <div class="ticker-scroll-wrapper">
    <div class="ticker-scroll" id="tickerScroll"></div>
  </div>
</div>

<div class="footer-bar" id="footerBar">
  <div class="footer-hashtag" id="footerHashtag">#PROACTIVEWIRE</div>
  <div class="footer-ctas" id="footerCtas"></div>
</div>

</div><!-- /overlay-root -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pusher/8.4.0-rc2/pusher.min.js"></script>
<script>
const CONFIG = {
  apiBase: 'https://wire.proactive.dev/api',
  wsKey: 'proactive-wire-key',
  wsHost: 'ws.proactive.dev',
  wsPort: 443,
};

// --- State ---
let timezones = [];
let activeTickers = [];
let footer = {};
let tickerSpeed = 5;
let tickerTween = null;
let tickerBaseDuration = 0;

// Convert 1-10 scale to animation duration in seconds
// 1 = 60s (slow), 5 = 36s (medium), 10 = 8s (fast)
function speedToDuration(level) {
  return Math.round(68 - (level * 6));
}
let clockInterval = null;
let prevTimes = {};

const CTA_CONFIG = {
  show_like:      { text: 'Like' },
  show_subscribe: { text: 'Subscribe' },
  show_chat:      { text: 'Join Chat' },
  show_share:     { text: 'Share' },
};

// ============================================================
// GSAP — Live dot blink
// ============================================================
gsap.to('#liveDot', {
  opacity: 0.2,
  duration: 0.6,
  repeat: -1,
  yoyo: true,
  ease: 'power1.inOut',
});

// ============================================================
// GSAP — Fade helper
// ============================================================
function fadeSwap(el, callback) {
  gsap.to(el, {
    opacity: 0,
    duration: 0.4,
    ease: 'power2.in',
    onComplete: () => {
      callback();
      gsap.to(el, { opacity: 1, duration: 0.4, ease: 'power2.out' });
    },
  });
}

// ============================================================
// Clocks
// ============================================================
function getTime(timezone) {
  return new Date().toLocaleTimeString('en-GB', {
    timeZone: timezone,
    hour: '2-digit',
    minute: '2-digit',
  });
}

function buildClockHTML() {
  const el = document.getElementById('clocks');
  el.innerHTML = timezones.map(tz => {
    const time = getTime(tz.timezone);
    prevTimes[tz.timezone] = time;
    const digits = time.split('').map((ch, i) => {
      if (ch === ':') return `<span class="clock-colon">:</span>`;
      return `<span class="clock-digit"><span class="clock-digit-inner" data-tz="${tz.timezone}" data-idx="${i}">${ch}</span></span>`;
    }).join('');
    return `<div class="clock-item">
      <span class="clock-city">${tz.label}</span>
      <span class="clock-time">${digits}</span>
    </div>`;
  }).join('');
}

function tickClocks() {
  timezones.forEach(tz => {
    const time = getTime(tz.timezone);
    const prev = prevTimes[tz.timezone] || '';
    if (time === prev) return;

    time.split('').forEach((ch, i) => {
      if (ch === ':' || prev[i] === ch) return;
      const digit = document.querySelector(`.clock-digit-inner[data-tz="${tz.timezone}"][data-idx="${i}"]`);
      if (!digit) return;

      gsap.to(digit, {
        y: '-60%',
        opacity: 0,
        duration: 0.3,
        ease: 'power2.in',
        onComplete: () => {
          digit.textContent = ch;
          gsap.fromTo(digit,
            { y: '60%', opacity: 0 },
            { y: '0%', opacity: 1, duration: 0.3, ease: 'power2.out' }
          );
        },
      });
    });

    prevTimes[tz.timezone] = time;
  });
}

function startClocks() {
  if (clockInterval) clearInterval(clockInterval);
  prevTimes = {};
  buildClockHTML();
  clockInterval = setInterval(tickClocks, 1000);
}

function updateTimezones(newTimezones) {
  fadeSwap('#clocks', () => {
    timezones = newTimezones;
    prevTimes = {};
    buildClockHTML();
  });
}

// ============================================================
// Ticker tape — CSS animation for scroll, GSAP for effects
// ============================================================
function buildTickerItemHTML(t) {
  const cls = t.change_pct >= 0 ? 'ticker-up' : 'ticker-down';
  const arrow = t.change_pct >= 0 ? '▲' : '▼';
  const price = Number(t.price).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return `<span class="ticker-item" data-ticker="${t.symbol}">
    <span class="ticker-symbol">${t.symbol}</span>
    <span class="ticker-price">${price}</span>
    <span class="ticker-change ${cls}">${arrow} ${Math.abs(t.change_pct || 0).toFixed(2)}%</span>
  </span>`;
}

function renderTickerTape() {
  if (tickerTween) { tickerTween.kill(); tickerTween = null; }

  const el = document.getElementById('tickerScroll');
  const wrapper = el.parentElement;
  const visible = activeTickers.filter(t => t.price != null);
  if (!visible.length) { el.innerHTML = ''; return; }

  // Build one set, measure it
  const oneSet = visible.map(buildTickerItemHTML).join('');
  el.innerHTML = oneSet;
  const oneSetWidth = el.scrollWidth;
  const viewportWidth = wrapper.offsetWidth;

  if (oneSetWidth === 0) return;

  // Enough copies so content fills viewport at any scroll position
  const copies = Math.max(2, Math.ceil((viewportWidth * 2) / oneSetWidth) + 1);
  el.innerHTML = Array(copies).fill(oneSet).join('');

  // GSAP infinite scroll — animate exactly one set width
  tickerBaseDuration = speedToDuration(tickerSpeed);
  gsap.set(el, { x: 0 });
  tickerTween = gsap.to(el, {
    x: -oneSetWidth,
    duration: tickerBaseDuration,
    ease: 'none',
    repeat: -1,
  });
}

function formatPrice(n) {
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function updateTickerPrices(newTickers) {
  newTickers.forEach(nt => {
    if (nt.price == null) return;
    const existing = activeTickers.find(t => t.symbol === nt.symbol);
    if (!existing) return;
    if (existing.price == nt.price && existing.change_pct == nt.change_pct) return;

    const oldPrice = Number(existing.price || 0);
    const newPrice = Number(nt.price);
    const oldPct = Number(existing.change_pct || 0);
    const newPct = Number(nt.change_pct || 0);

    existing.price = nt.price;
    existing.change_pct = nt.change_pct;

    document.querySelectorAll(`[data-ticker="${nt.symbol}"]`).forEach(el => {
      const priceEl = el.querySelector('.ticker-price');
      const changeEl = el.querySelector('.ticker-change');
      if (!priceEl || !changeEl) return;

      // Animate price number smoothly
      const proxy = { val: oldPrice };
      gsap.to(proxy, {
        val: newPrice,
        duration: 1,
        ease: 'power1.out',
        onUpdate: () => { priceEl.textContent = formatPrice(proxy.val); },
      });

      // Animate change % number smoothly
      const pctProxy = { val: oldPct };
      gsap.to(pctProxy, {
        val: newPct,
        duration: 1,
        ease: 'power1.out',
        onUpdate: () => {
          const arrow = pctProxy.val >= 0 ? '▲' : '▼';
          changeEl.textContent = `${arrow} ${Math.abs(pctProxy.val).toFixed(2)}%`;
        },
      });

      // Smooth color transition on direction change
      if ((oldPct >= 0) !== (newPct >= 0)) {
        gsap.to(changeEl, { color: newPct >= 0 ? '#22c55e' : '#ef4444', duration: 0.6, ease: 'power2.inOut' });
      }

      // Flash background on price change
      if (newPrice !== oldPrice) {
        const flashColor = newPrice > oldPrice ? 'rgba(34,197,94,0.25)' : 'rgba(239,68,68,0.25)';
        gsap.fromTo(priceEl,
          { backgroundColor: flashColor },
          { backgroundColor: 'transparent', duration: 1.5, ease: 'power2.out' }
        );
      }
    });
  });
}

function replaceTickersFade(newTickers) {
  fadeSwap('#tickerStrip', () => {
    activeTickers = newTickers;
    renderTickerTape();
  });
}

// ============================================================
// Footer
// ============================================================
function renderFooter() {
  document.getElementById('footerHashtag').textContent = footer.hashtag || '#PROACTIVEWIRE';

  const ctas = document.getElementById('footerCtas');
  ctas.innerHTML = Object.entries(CTA_CONFIG)
    .filter(([key]) => footer[key] !== false)
    .map(([, cfg], i, arr) => `<div class="footer-cta">
      <span class="footer-cta-text">${cfg.text}</span>
    </div>${i < arr.length - 1 ? '<span class="footer-cta-sep">·</span>' : ''}`).join('');
}

function updateFooter(newFooter) {
  const tl = gsap.timeline();
  tl.to('#footerHashtag', { opacity: 0, duration: 0.3, ease: 'power2.in' }, 0);
  tl.to('#footerCtas', { opacity: 0, duration: 0.3, ease: 'power2.in' }, 0);
  tl.call(() => { footer = newFooter; renderFooter(); });
  tl.to('#footerHashtag', { opacity: 1, duration: 0.3, ease: 'power2.out' });
  tl.to('#footerCtas', { opacity: 1, duration: 0.3, ease: 'power2.out' }, '<');
}

// ============================================================
// Initial load
// ============================================================
async function loadState() {
  try {
    const res = await fetch(`${CONFIG.apiBase}/overlay/state`);
    const data = await res.json();

    timezones = data.timezones;
    tickerSpeed = data.ticker_speed || 5;
    footer = data.footer || {};
    activeTickers = data.tickers || [];

    renderBackground(data.background || {});
    startClocks();
    renderTickerTape();
    renderFooter();

    // Entrance animation
    gsap.from('.top-bar', { y: -72, duration: 0.6, ease: 'power3.out' });
    gsap.from('#tickerStrip', { y: 80, duration: 0.6, ease: 'power3.out', delay: 0.2 });
    gsap.from('#footerBar', { y: 36, duration: 0.6, ease: 'power3.out', delay: 0.3 });
  } catch (e) {
    console.error('Failed to load overlay state:', e);
  }
}

// ============================================================
// WebSocket
// ============================================================
function connectWebSocket() {
  Pusher.logToConsole = true;

  const pusher = new Pusher(CONFIG.wsKey, {
    cluster: '',
    wsHost: CONFIG.wsHost,
    wsPort: CONFIG.wsPort,
    wssPort: CONFIG.wsPort,
    forceTLS: true,
    enabledTransports: ['ws', 'wss'],
    disableStats: true,
  });

  const channel = pusher.subscribe('wire.overlay');

  channel.bind('App\\Events\\TimezonesUpdated', (data) => {
    updateTimezones(data.timezones);
  });

  channel.bind('App\\Events\\SettingsUpdated', (data) => {
    if (data.settings.ticker_speed && data.settings.ticker_speed !== tickerSpeed) {
      tickerSpeed = data.settings.ticker_speed;

      if (tickerTween && tickerBaseDuration > 0) {
        const newTimeScale = tickerBaseDuration / speedToDuration(tickerSpeed);
        gsap.to(tickerTween, { timeScale: newTimeScale, duration: 2, ease: 'power2.inOut' });
      }
    }

    if (data.settings.background) {
      updateBackground(data.settings.background);
    }
  });

  channel.bind('App\\Events\\TickersUpdated', (data) => {
    updateTickerPrices(data.tickers);
  });

  channel.bind('App\\Events\\FooterUpdated', (data) => {
    updateFooter(data.footer);
  });

  pusher.connection.bind('connected', () => {
    console.log('[WS] Connected');
  });
}

// ============================================================
// Scale overlay to fit viewport
// ============================================================
function scaleOverlay() {
  const root = document.getElementById('overlayRoot');
  const scaleX = window.innerWidth / 1920;
  const scaleY = window.innerHeight / 1080;
  const scale = Math.min(scaleX, scaleY);
  root.style.transform = `translate(-50%, -50%) scale(${scale})`;
}
window.addEventListener('resize', scaleOverlay);
scaleOverlay();

// ============================================================
// Background pattern
// ============================================================
let bgConfig = {};

function renderBackground(config) {
  bgConfig = config || {};
  const container = document.getElementById('bgPattern');
  const root = document.getElementById('overlayRoot');

  if (!bgConfig.enabled) {
    container.innerHTML = '';
    root.style.background = bgConfig.bg_color || '#1a1a1e';
    return;
  }

  root.style.background = bgConfig.bg_color || '#1a1a1e';

  const text = bgConfig.text || 'PROACTIVE INVESTORS';
  const angle = bgConfig.angle ?? 25;
  const textColor = bgConfig.text_color || '#ffffff';
  const opacity = (bgConfig.text_opacity ?? 3) / 100;
  const fontSize = bgConfig.font_size || 48;
  // 1=stopped, 2-10 = 500s down to 100s
  const speedLevel = bgConfig.speed || 5;
  const speed = speedLevel <= 1 ? 0 : Math.round(560 - (speedLevel * 50));
  const direction = bgConfig.direction || 'up-left';

  // Direction mapping:
  // rotate(-angle) + scroll left  = ↖ up-left
  // rotate(-angle) + scroll right = ↘ down-right
  // rotate(+angle) + scroll left  = ↙ down-left
  // rotate(+angle) + scroll right = ↗ up-right
  const isUp = direction.includes('up');
  const isLeft = direction.includes('left');
  const rotSign = (isLeft === isUp) ? 1 : -1;

  const rowHeight = fontSize * 1.6;
  const rows = 40;

  // Build one set of text spans
  const oneSet = Array(10).fill(
    `<span class="bg-pattern-text" style="font-size:${fontSize}px;color:${textColor};opacity:${opacity}">${text}</span>`
  ).join('');

  let html = '';
  for (let i = 0; i < rows; i++) {
    // Scroll: left dirs = default, right dirs = reverse. Alternate flips odd rows.
    const alternate = bgConfig.alternate_rows && (i % 2 === 1);
    const shouldReverse = isLeft ? alternate : !alternate;
    const reverseRow = shouldReverse ? ' reverse' : '';
    const offset = (i % 2 === 0) ? 0 : fontSize * 4;
    html += `<div class="bg-pattern-row" style="height:${rowHeight}px">`;
    const animStyle = speed > 0 ? `--bg-speed:${speed}s` : 'animation:none';
    html += `<div class="bg-pattern-scroll${reverseRow}" style="${animStyle};padding-left:${offset}px">`;
    html += oneSet + oneSet;
    html += `</div></div>`;
  }

  container.innerHTML = html;
  container.style.transform = `rotate(${rotSign * angle}deg)`;
}

// ---- Background transition effects ----
const bgTransitions = {

  // 1. Dissolve — random scatter fade
  dissolve(spans, done) {
    gsap.to(spans, {
      opacity: 0,
      duration: 0.3,
      stagger: { each: 0.005, from: 'random' },
      onComplete: done,
    });
  },
  dissolveIn(spans, targetOpacity) {
    gsap.fromTo(spans,
      { opacity: 0 },
      { opacity: targetOpacity, duration: 0.4, stagger: { each: 0.005, from: 'random' } }
    );
  },

  // 2. Typewriter — left to right reveal
  typewriter(spans, done) {
    gsap.to(spans, {
      opacity: 0,
      duration: 0.2,
      stagger: { each: 0.003, from: 'start' },
      onComplete: done,
    });
  },
  typewriterIn(spans, targetOpacity) {
    gsap.fromTo(spans,
      { opacity: 0 },
      { opacity: targetOpacity, duration: 0.2, stagger: { each: 0.003, from: 'start' } }
    );
  },

  // 3. Cascade — top to bottom rows
  cascade(spans, done) {
    gsap.to(spans, {
      opacity: 0,
      y: -20,
      duration: 0.4,
      stagger: { each: 0.008, from: 'start' },
      onComplete: done,
    });
  },
  cascadeIn(spans, targetOpacity) {
    gsap.fromTo(spans,
      { opacity: 0, y: 20 },
      { opacity: targetOpacity, y: 0, duration: 0.4, stagger: { each: 0.008, from: 'start' } }
    );
  },

  // 4. Glitch — digital flicker
  glitch(spans, done) {
    gsap.to(spans, {
      opacity: 0,
      duration: 0.15,
      stagger: { each: 0.001, from: 'random', repeat: 2, yoyo: true },
      onComplete: done,
    });
  },
  glitchIn(spans, targetOpacity) {
    gsap.fromTo(spans,
      { opacity: 0 },
      { opacity: targetOpacity, duration: 0.15, stagger: { each: 0.001, from: 'random', repeat: 2, yoyo: true } }
    );
  },

  // 5. Blinds — rows collapse like shutters
  blinds(spans, done) {
    const rows = document.querySelectorAll('.bg-pattern-row');
    gsap.to(rows, {
      scaleY: 0,
      opacity: 0,
      duration: 0.3,
      stagger: { each: 0.02, from: 'edges' },
      onComplete: done,
    });
  },
  blindsIn(spans, targetOpacity) {
    const rows = document.querySelectorAll('.bg-pattern-row');
    gsap.fromTo(rows,
      { scaleY: 0, opacity: 0 },
      { scaleY: 1, opacity: 1, duration: 0.3, stagger: { each: 0.02, from: 'edges' } }
    );
  },
};

function updateBackground(config) {
  const container = document.getElementById('bgPattern');
  const spans = container.querySelectorAll('.bg-pattern-text');
  const newText = config.text || bgConfig.text || 'PROACTIVE INVESTORS';
  const textChanged = newText !== (bgConfig.text || '');
  const effect = config.transition || bgConfig.transition || 'wave';
  const targetOpacity = (config.text_opacity ?? bgConfig.text_opacity ?? 3) / 100;

  // Smooth background color transition always
  gsap.to(document.getElementById('overlayRoot'), {
    backgroundColor: config.bg_color || '#1a1a1e',
    duration: 1.5,
    ease: 'power2.inOut',
  });

  if (spans.length > 0) {
    const outFn = bgTransitions[effect] || bgTransitions.dissolve;
    const inFn = bgTransitions[effect + 'In'] || bgTransitions.dissolveIn;

    outFn(spans, () => {
      renderBackground(config);
      const newSpans = container.querySelectorAll('.bg-pattern-text');
      inFn(newSpans, targetOpacity);
    });
  } else {
    renderBackground(config);
  }
}

connectWebSocket();
