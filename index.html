<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Proactive Wire Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800&family=Barlow:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #ffffff;
    --accent: #fdb826;
    --accent2: #2d2d2d;
    --text: #1a1a1a;
    --dim: #6b7280;
    --panel: #2d2d2d;
    --border: rgba(255, 255, 255, 0.12);
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  .overlay-root {
    --s: 1.5; /* scale factor: 1920/1280 */
    width: 1920px;
    height: 1080px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: center center;
    background: var(--bg);
    font-family: 'Barlow', sans-serif;
    color: var(--text);
  }

  /* TOP BAR */
  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 72px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 30px;
    gap: 24px;
    z-index: 20;
  }

  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 27px;
    letter-spacing: 4px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .logo { color: #ffffff; }
  .logo span { color: var(--accent); }

  .divider {
    width: 1px;
    height: 30px;
    background: rgba(255, 255, 255, 0.15);
  }

  .scene-badge {
    background: var(--accent);
    color: #1a1a1a;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
    padding: 6px 18px;
    border-radius: 3px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #f04060;
    white-space: nowrap;
  }
  .live-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #f04060;
    animation: blink 1.2s ease-in-out infinite;
    box-shadow: 0 0 8px rgba(240, 64, 96, 0.6);
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.2;} }

  /* CLOCKS */
  .top-clocks {
    margin-left: auto;
    display: flex;
    gap: 6px;
    transition: opacity 0.4s ease;
  }
  .top-clocks.fading { opacity: 0; }

  .clock-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 18px;
    border-left: 1px solid var(--border);
  }
  .clock-item:first-child { border-left: none; }

  .clock-city {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 2px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
  }
  .clock-time {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #ffffff;
    display: flex;
    gap: 0;
  }

  .clock-digit {
    display: inline-block;
    width: 0.6em;
    text-align: center;
    overflow: hidden;
    height: 1.2em;
    line-height: 1.2em;
    position: relative;
  }

  .clock-digit-inner {
    display: block;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
  }

  .clock-digit-inner.flip {
    animation: digitFlip 0.7s ease-in-out;
  }

  @keyframes digitFlip {
    0%   { transform: translateY(0); opacity: 1; }
    30%  { transform: translateY(-60%); opacity: 0; }
    50%  { transform: translateY(60%); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .clock-colon {
    width: 0.3em;
    text-align: center;
    opacity: 0.5;
  }
</style>
</head>
<body>

<div class="overlay-root" id="overlayRoot">
<div class="top-bar">
  <div class="logo">PROACTIVE <span>WIRE</span></div>
  <div class="divider"></div>
  <div class="scene-badge" id="sceneBadge">LIVE</div>
  <div class="live-badge"><div class="live-dot"></div>LIVE</div>
  <div class="top-clocks" id="clocks"></div>
</div>

</div><!-- /overlay-root -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pusher/8.4.0-rc2/pusher.min.js"></script>
<script>
const CONFIG = {
  apiBase: 'https://wire.proactive.dev/api',
  wsKey: 'proactive-wire-key',
  wsHost: 'ws.proactive.dev',
  wsPort: 443,
};

// --- State ---
let timezones = [];
let clockInterval = null;
let prevTimes = {};

// --- Clocks ---
function getTime(timezone) {
  return new Date().toLocaleTimeString('en-GB', {
    timeZone: timezone,
    hour: '2-digit',
    minute: '2-digit',
  });
}

function buildClockHTML() {
  const el = document.getElementById('clocks');
  el.innerHTML = timezones.map(tz => {
    const time = getTime(tz.timezone);
    prevTimes[tz.timezone] = time;
    const digits = time.split('').map((ch, i) => {
      if (ch === ':') return `<span class="clock-colon">:</span>`;
      return `<span class="clock-digit"><span class="clock-digit-inner" data-tz="${tz.timezone}" data-idx="${i}">${ch}</span></span>`;
    }).join('');
    return `<div class="clock-item">
      <span class="clock-city">${tz.label}</span>
      <span class="clock-time">${digits}</span>
    </div>`;
  }).join('');
}

function tickClocks() {
  timezones.forEach(tz => {
    const time = getTime(tz.timezone);
    const prev = prevTimes[tz.timezone] || '';
    if (time === prev) return;

    time.split('').forEach((ch, i) => {
      if (ch === ':') return;
      if (prev[i] === ch) return;
      const digit = document.querySelector(`.clock-digit-inner[data-tz="${tz.timezone}"][data-idx="${i}"]`);
      if (!digit) return;
      digit.classList.remove('flip');
      void digit.offsetWidth;
      digit.textContent = ch;
      digit.classList.add('flip');
    });

    prevTimes[tz.timezone] = time;
  });
}

function startClocks() {
  if (clockInterval) clearInterval(clockInterval);
  prevTimes = {};
  buildClockHTML();
  clockInterval = setInterval(tickClocks, 1000);
}

// --- Fade transition ---
function updateTimezones(newTimezones) {
  const el = document.getElementById('clocks');
  el.classList.add('fading');

  setTimeout(() => {
    timezones = newTimezones;
    prevTimes = {};
    buildClockHTML();
    el.classList.remove('fading');
  }, 400);
}

// --- Initial load ---
async function loadState() {
  try {
    const res = await fetch(`${CONFIG.apiBase}/overlay/state`);
    const data = await res.json();
    timezones = data.timezones;
    startClocks();
  } catch (e) {
    console.error('Failed to load overlay state:', e);
  }
}

// --- WebSocket ---
function connectWebSocket() {
  Pusher.logToConsole = true;

  const pusher = new Pusher(CONFIG.wsKey, {
    cluster: '',
    wsHost: CONFIG.wsHost,
    wsPort: CONFIG.wsPort,
    wssPort: CONFIG.wsPort,
    forceTLS: true,
    enabledTransports: ['ws', 'wss'],
    disableStats: true,
  });

  const channel = pusher.subscribe('wire.overlay');

  channel.bind_global((eventName, data) => {
    console.log('[WS event]', eventName, data);
  });

  channel.bind('App\\Events\\TimezonesUpdated', (data) => {
    console.log('TimezonesUpdated:', data);
    updateTimezones(data.timezones);
  });

  pusher.connection.bind('state_change', (states) => {
    console.log('[WS state]', states.previous, '->', states.current);
  });

  pusher.connection.bind('connected', () => {
    console.log('[WS] Connected, socket_id:', pusher.connection.socket_id);
  });

  pusher.connection.bind('error', (err) => {
    console.error('[WS] Error:', err);
  });
}

// --- Scale to fit viewport (16:9) ---
function scaleOverlay() {
  const root = document.getElementById('overlayRoot');
  const scaleX = window.innerWidth / 1920;
  const scaleY = window.innerHeight / 1080;
  const scale = Math.min(scaleX, scaleY);
  root.style.transform = `translate(-50%, -50%) scale(${scale})`;
}
window.addEventListener('resize', scaleOverlay);
scaleOverlay();

// --- Init ---
loadState();
connectWebSocket();
</script>
</body>
</html>
