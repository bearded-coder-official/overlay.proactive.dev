<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Proactive Wire Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800&family=Barlow:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1a1a1e;
    --accent: #fdb826;
    --accent2: #2d2d2d;
    --text: #1a1a1a;
    --dim: #6b7280;
    --panel: #2d2d2d;
    --border: rgba(255, 255, 255, 0.15);
    --top-bar-h: 72px;
    --breaking-h: 38px;
    --footer-zone-h: 80px;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  .overlay-root {
    width: 1920px;
    height: 1080px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: center center;
    background: var(--bg);
    font-family: 'Barlow', sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  /* BG PATTERN */
  .bg-pattern {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }

  .bg-pattern-inner {
    position: absolute;
    top: -100%;
    left: -100%;
    width: 300%;
    height: 300%;
  }

  .bg-pattern-scroll {
    display: inline-flex;
    white-space: nowrap;
    animation: bgScroll var(--bg-speed, 60s) linear infinite;
  }

  .bg-pattern-scroll.reverse {
    animation-direction: reverse;
  }

  @keyframes bgScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  .bg-pattern-row {
    white-space: nowrap;
    line-height: 1;
  }

  .bg-pattern-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    letter-spacing: 12px;
    text-transform: uppercase;
    display: inline;
    padding: 0 40px;
  }

  /* BREAKING NEWS */
  .breaking-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: var(--breaking-h);
    background: rgba(200, 20, 40, 0.95);
    display: flex;
    align-items: center;
    overflow: hidden;
    z-index: 30;
    will-change: transform;
  }

  .breaking-label {
    background: #7a0818;
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2.5px;
    padding: 0 16px;
    height: 100%;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .breaking-scroll-wrapper {
    flex: 1;
    overflow: hidden;
    display: flex;
    align-items: center;
    height: 100%;
  }

  .breaking-scroll {
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    animation: breakingScroll 15s linear infinite;
    line-height: 1;
  }

  .breaking-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
    padding: 0 40px;
    white-space: nowrap;
    text-transform: uppercase;
    line-height: 1;
  }

  @keyframes breakingScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* TOP BAR */
  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: var(--top-bar-h);
    will-change: transform;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 30px;
    gap: 24px;
    z-index: 20;
  }

  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 27px;
    letter-spacing: 4px;
    text-transform: uppercase;
    white-space: nowrap;
    color: #ffffff;
  }
  .logo span { color: var(--accent); }

  .divider {
    width: 1px;
    height: 30px;
    background: rgba(255, 255, 255, 0.15);
  }

  .scene-badge {
    background: var(--accent);
    color: #1a1a1a;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
    padding: 6px 18px;
    border-radius: 3px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #f04060;
    white-space: nowrap;
  }
  .live-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #f04060;
    box-shadow: 0 0 8px rgba(240, 64, 96, 0.6);
  }

  /* CLOCKS */
  .top-clocks {
    margin-left: auto;
    display: flex;
    gap: 6px;
  }

  .clock-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 18px;
    border-left: 1px solid var(--border);
  }
  .clock-item:first-child { border-left: none; }

  .clock-city {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 2px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
  }
  .clock-time {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #ffffff;
    display: flex;
    gap: 0;
  }

  .clock-digit {
    display: inline-block;
    width: 0.6em;
    text-align: center;
    overflow: hidden;
    height: 1.2em;
    line-height: 1.2em;
    position: relative;
  }

  .clock-digit-inner {
    display: block;
  }

  .clock-colon {
    width: 0.3em;
    text-align: center;
    opacity: 0.5;
  }

  /* CONTENT AREA */
  .content-area {
    position: absolute;
    top: var(--top-bar-h);
    bottom: var(--footer-zone-h);
    left: 0;
    right: 0;
    padding: 16px 32px;
    gap: 32px;
    z-index: 5;
    display: flex;
    align-items: center;
    will-change: top;
  }

  .video-block {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    align-self: stretch;
    min-width: 0;
  }

  .video-frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    max-height: 100%;
    background: #000;
    overflow: hidden;
    position: relative;
    opacity: 0;
    will-change: opacity, transform;
  }

  .content-video,
  .content-iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
  }

  .video-frame.show-video .content-video { display: block; }
  .video-frame.show-iframe .content-iframe { display: block; background: #fff; }
  .video-frame.show-voice .voice-layout { display: flex; }

  .content-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* VOICE BLOCK — split layout: cover left, scrolling article right */
  .voice-layout {
    position: absolute;
    inset: 0;
    display: none;
    background: #1c1e24;
  }

  .voice-cover {
    flex: 0 0 50%;
    height: 100%;
    background: #1c1e24;
    overflow: hidden;
    position: relative;
  }
  .voice-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .voice-cover::after {
    /* subtle right-edge gradient so the cover blends into the text panel */
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 120px;
    background: linear-gradient(90deg, rgba(28,30,36,0) 0%, rgba(28,30,36,0.8) 100%);
    pointer-events: none;
  }

  .voice-text {
    flex: 1 1 50%;
    min-width: 0;
    overflow: hidden;
    position: relative;
    color: #e6e8ee;
    font-family: 'Barlow', sans-serif;
    isolation: isolate;
  }
  /* Blurred cover as the text-panel background — visually unified with the cover */
  .voice-text::before {
    content: '';
    position: absolute;
    inset: -40px;
    background-image: var(--voice-cover-bg, none);
    background-size: cover;
    background-position: center;
    filter: blur(60px) brightness(0.45) saturate(1.1);
    transform: scale(1.15);
    z-index: -2;
  }
  /* Dark warm tint on top of the blurred cover so text stays legible */
  .voice-text::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(28,30,36,0.78) 0%, rgba(20,22,28,0.92) 100%);
    z-index: -1;
  }
  /* Reading-window viewport: clips the absolute scroller AND
     applies a top/bottom alpha mask so text fades smoothly in and out
     instead of leaking into the lower-third area. */
  .voice-text-window {
    position: absolute;
    top: 0;
    bottom: 124px; /* never enter the lower-third zone */
    left: 0;
    right: 0;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(180deg,
      rgba(0,0,0,0) 0,
      rgba(0,0,0,1) 110px,
      rgba(0,0,0,1) calc(100% - 90px),
      rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(180deg,
      rgba(0,0,0,0) 0,
      rgba(0,0,0,1) 110px,
      rgba(0,0,0,1) calc(100% - 90px),
      rgba(0,0,0,0) 100%);
  }

  .voice-text-inner {
    position: absolute;
    left: 80px;
    right: 80px;
    top: 0;
    will-change: transform;
  }
  .voice-text-inner p {
    font-size: 26px;
    line-height: 1.55;
    margin: 0 0 22px 0;
    font-weight: 400;
    color: #d8dbe2;
  }
  .voice-text-inner p:first-child {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 32px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.3px;
  }

  /* LOWER THIRD — overlays bottom of video-frame */
  .lower-third {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(45, 45, 45, 0.92);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: stretch;
    height: 124px;
    z-index: 5;
    opacity: 0;
    will-change: opacity, transform;
  }

  .lt-progress {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(255, 255, 255, 0.08);
  }
  .lt-progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.2s linear;
  }

  .lt-main {
    flex: 1;
    min-width: 0;
    padding: 22px 32px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
  }

  .lt-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #fff;
    line-height: 1.1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .lt-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .lt-meta-sector {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2.5px;
    color: var(--accent);
    background: rgba(253, 184, 38, 0.12);
    padding: 6px 14px;
    text-transform: uppercase;
  }

  .lt-meta-company {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #fff;
    text-transform: uppercase;
  }

  .lt-meta-divider {
    width: 1px;
    height: 22px;
    background: rgba(255, 255, 255, 0.15);
  }

  .lt-meta-ticker {
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .lt-meta-ticker-symbol {
    color: rgba(255, 255, 255, 0.5);
  }

  .lt-meta-ticker-price {
    color: #fff;
    font-variant-numeric: tabular-nums;
  }

  .lt-meta-ticker-change {
    font-variant-numeric: tabular-nums;
    font-size: 15px;
  }
  .lt-meta-ticker-change.up { color: #22c55e; }
  .lt-meta-ticker-change.down { color: #ef4444; }

  .lt-qr-side {
    width: 124px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-left: 1px solid rgba(255, 255, 255, 0.08);
  }

  .lt-qr {
    width: 96px;
    height: 96px;
    background: #fff;
    padding: 6px;
  }
  .lt-qr img, .lt-qr canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }

  /* ============================================================
     AUGMENTATION OVERLAYS
     Floating contextual graphics over the video.
     Three types: persistent SESSION BUG, periodic MARKET PULSE,
     event-driven PRICE ALERT.
     ============================================================ */

  /* --- AUG STACK: fixed right column of widgets ---
     container-type: inline-size enables cqi-based dynamic sizing.
     Change `width` to scale all child fonts/spacing automatically. */
  .aug-stack {
    flex-shrink: 0;
    align-self: center;
    order: 2;
    width: 320px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 12px;
    container-type: inline-size;
    font-family: 'Barlow Condensed', sans-serif;
  }

  /* --- SESSION BUG --- */
  .aug-bug {
    background: var(--panel);
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 64px;
    max-height: 110px;
    min-width: 0;
  }
  .aug-bug-row {
    padding: clamp(9px, 3cqi, 16px) clamp(14px, 4.5cqi, 22px);
    display: flex;
    align-items: center;
    gap: clamp(10px, 3.5cqi, 18px);
    flex: 1 1 0;
    min-height: 0;
  }
  .aug-bug-row + .aug-bug-row {
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .aug-bug-dot {
    width: clamp(8px, 2.8cqi, 14px);
    height: clamp(8px, 2.8cqi, 14px);
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 8px #22c55e;
    animation: aug-bug-pulse 1.5s ease-in-out infinite;
    flex-shrink: 0;
  }
  .aug-bug-dot.closed { background: rgba(255,255,255,0.35); box-shadow: none; animation: none; }
  .aug-bug-dot.next   { background: var(--accent); box-shadow: 0 0 6px rgba(253,184,38,0.6); animation: none; }
  @keyframes aug-bug-pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }
  .aug-bug-text {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .aug-bug-label {
    font-size: clamp(11px, 4cqi, 18px);
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    line-height: 1;
  }
  .aug-bug-time {
    font-size: clamp(15px, 5.8cqi, 26px);
    font-weight: 800;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    letter-spacing: 0.03em;
  }
  .aug-bug-time.dim { color: rgba(255,255,255,0.35); }

  /* --- MARKET PULSE --- */
  .aug-pulse {
    background: var(--panel);
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 170px;
    max-height: 270px;
    min-width: 0;
    overflow: hidden;
  }
  .aug-pulse-head {
    background: var(--accent);
    padding: clamp(8px, 3cqi, 16px) clamp(14px, 4.5cqi, 22px);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .aug-pulse-tag {
    color: #1a1a1a;
    font-size: clamp(13px, 4.5cqi, 20px);
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    line-height: 1;
  }
  .aug-pulse-title {
    color: rgba(26,26,26,0.7);
    font-size: clamp(12px, 4cqi, 18px);
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 1;
  }
  .aug-pulse-rows {
    padding: clamp(4px, 1.5cqi, 8px) clamp(14px, 4.5cqi, 22px) clamp(8px, 2.5cqi, 14px);
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .aug-pulse-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center;
    gap: clamp(10px, 3.5cqi, 18px);
    padding: clamp(7px, 2.5cqi, 12px) 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex: 1 1 0;
    min-height: 0;
  }
  .aug-pulse-row:last-child { border-bottom: none; }
  .aug-pulse-name {
    font-size: clamp(15px, 5.5cqi, 24px);
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .aug-pulse-value {
    font-size: clamp(15px, 5.5cqi, 24px);
    font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .aug-pulse-change {
    font-size: clamp(13px, 4.8cqi, 20px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    min-width: clamp(56px, 19cqi, 86px);
    text-align: right;
  }
  .aug-pulse-change.up { color: #22c55e; }
  .aug-pulse-change.down { color: #ef4444; }

  /* --- FEAR & GREED --- */
  .aug-fg {
    background: var(--panel);
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 150px;
    max-height: 230px;
    min-width: 0;
    overflow: hidden;
  }
  .aug-fg-head {
    background: var(--accent);
    padding: clamp(8px, 3cqi, 16px) clamp(14px, 4.5cqi, 22px);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .aug-fg-tag {
    color: #1a1a1a;
    font-size: clamp(13px, 4.5cqi, 20px);
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    line-height: 1;
  }
  .aug-fg-sub {
    color: rgba(26,26,26,0.7);
    font-size: clamp(12px, 4cqi, 18px);
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 1;
  }
  .aug-fg-body {
    padding: clamp(14px, 4.5cqi, 22px) clamp(16px, 5cqi, 24px) clamp(16px, 5cqi, 24px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(10px, 3.5cqi, 18px);
    flex: 1 1 0;
    min-height: 0;
  }
  .aug-fg-display {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: clamp(10px, 3cqi, 16px);
  }
  .aug-fg-value {
    font-size: clamp(40px, 14cqi, 64px);
    font-weight: 900;
    line-height: 0.85;
    letter-spacing: -0.02em;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .aug-fg-label {
    font-size: clamp(13px, 4.5cqi, 20px);
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    line-height: 1;
    text-align: right;
  }
  .aug-fg-bar-wrap {
    position: relative;
    padding-top: clamp(10px, 3.5cqi, 16px);
  }
  .aug-fg-marker {
    position: absolute;
    top: 0;
    width: 0;
    height: 0;
    border-left: clamp(5px, 1.8cqi, 8px) solid transparent;
    border-right: clamp(5px, 1.8cqi, 8px) solid transparent;
    border-top: clamp(7px, 2.5cqi, 11px) solid #fff;
    transform: translateX(-50%);
    transition: left 0.4s ease-out;
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.5));
  }
  .aug-fg-bar {
    display: flex;
    gap: clamp(2px, 0.7cqi, 4px);
    height: clamp(12px, 4cqi, 18px);
  }
  .aug-fg-bar-cell {
    flex: 1;
    opacity: 0.18;
    transition: opacity 0.3s;
  }
  .aug-fg-bar-cell.active { opacity: 1; }
  .aug-fg-bar-cell.c0 { background: #ef4444; }
  .aug-fg-bar-cell.c1 { background: #f97316; }
  .aug-fg-bar-cell.c2 { background: #facc15; }
  .aug-fg-bar-cell.c3 { background: #84cc16; }
  .aug-fg-bar-cell.c4 { background: #22c55e; }
  .aug-fg-ends {
    display: flex;
    justify-content: space-between;
    font-size: clamp(9px, 3.2cqi, 13px);
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    line-height: 1;
  }

  /* --- SPONSOR / AD (banner) --- */
  .aug-ad {
    background: var(--panel);
    position: relative;
    flex: 0 0 auto;
  }
  .aug-ad-tag {
    position: absolute;
    top: 0;
    left: 0;

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pusher/8.4.0-rc2/pusher.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const CONFIG = {
  apiBase: 'https://wire.proactive.dev/api',
  wsKey: 'proactive-wire-key',
  wsHost: 'ws.proactive.dev',
  wsPort: 443,
};

// --- State ---
let timezones = [];
let activeTickers = [];
let footer = {};
let tickerSpeed = 5;
let tickerTween = null;
let tickerBaseDuration = 0;

// Convert 1-10 scale to animation duration in seconds
// 1 = 60s (slow), 5 = 36s (medium), 10 = 8s (fast)
function speedToDuration(level) {
  return Math.round(68 - (level * 6));
}
let clockInterval = null;
let prevTimes = {};

const CTA_CONFIG = {
  show_like:      { text: 'Like' },
  show_subscribe: { text: 'Subscribe' },
  show_chat:      { text: 'Join Chat' },
  show_share:     { text: 'Share' },
};

// ============================================================
// GSAP — Live dot blink
// ============================================================
gsap.to('#liveDot', {
  opacity: 0.2,
  duration: 0.6,
  repeat: -1,
  yoyo: true,
  ease: 'power1.inOut',
});

// ============================================================
// GSAP — Fade helper
// ============================================================
function fadeSwap(el, callback) {
  gsap.to(el, {
    opacity: 0,
    duration: 0.4,
    ease: 'power2.in',
    onComplete: () => {
      callback();
      gsap.to(el, { opacity: 1, duration: 0.4, ease: 'power2.out' });
    },
  });
}

// ============================================================
// Clocks
// ============================================================
function getTime(timezone) {
  return new Date().toLocaleTimeString('en-GB', {
    timeZone: timezone,
    hour: '2-digit',
    minute: '2-digit',
  });
}

function buildClockHTML() {
  const el = document.getElementById('clocks');
  el.innerHTML = timezones.map(tz => {
    const time = getTime(tz.timezone);
    prevTimes[tz.timezone] = time;
    const digits = time.split('').map((ch, i) => {
      if (ch === ':') return `<span class="clock-colon">:</span>`;
      return `<span class="clock-digit"><span class="clock-digit-inner" data-tz="${tz.timezone}" data-idx="${i}">${ch}</span></span>`;
    }).join('');
    return `<div class="clock-item">
      <span class="clock-city">${tz.label}</span>
      <span class="clock-time">${digits}</span>
    </div>`;
  }).join('');
}

function tickClocks() {
  timezones.forEach(tz => {
    const time = getTime(tz.timezone);
    const prev = prevTimes[tz.timezone] || '';
    if (time === prev) return;

    time.split('').forEach((ch, i) => {
      if (ch === ':' || prev[i] === ch) return;
      const digit = document.querySelector(`.clock-digit-inner[data-tz="${tz.timezone}"][data-idx="${i}"]`);
      if (!digit) return;

      gsap.to(digit, {
        y: '-60%',
        opacity: 0,
        duration: 0.3,
        ease: 'power2.in',
        onComplete: () => {
          digit.textContent = ch;
          gsap.fromTo(digit,
            { y: '60%', opacity: 0 },
            { y: '0%', opacity: 1, duration: 0.3, ease: 'power2.out' }
          );
        },
      });
    });

    prevTimes[tz.timezone] = time;
  });
}

function startClocks() {
  if (clockInterval) clearInterval(clockInterval);
  prevTimes = {};
  buildClockHTML();
  clockInterval = setInterval(tickClocks, 1000);
}

function updateTimezones(newTimezones) {
  fadeSwap('#clocks', () => {
    timezones = newTimezones;
    prevTimes = {};
    buildClockHTML();
  });
}

// ============================================================
// Ticker tape — CSS animation for scroll, GSAP for effects
// ============================================================
function buildTickerItemHTML(t) {
  const cls = t.change_pct >= 0 ? 'ticker-up' : 'ticker-down';
  const arrow = t.change_pct >= 0 ? '▲' : '▼';
  const price = Number(t.price).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return `<span class="ticker-item" data-ticker="${t.symbol}">
    <span class="ticker-symbol">${t.symbol}</span>
    <span class="ticker-price">${price}</span>
    <span class="ticker-change ${cls}">${arrow} ${Math.abs(t.change_pct || 0).toFixed(2)}%</span>
  </span>`;
}

function renderTickerTape() {
  if (tickerTween) { tickerTween.kill(); tickerTween = null; }

  const el = document.getElementById('tickerScroll');
  const wrapper = el.parentElement;
  const visible = activeTickers.filter(t => t.price != null);
  if (!visible.length) { el.innerHTML = ''; return; }

  // Build one set, measure it
  const oneSet = visible.map(buildTickerItemHTML).join('');
  el.innerHTML = oneSet;
  const oneSetWidth = el.scrollWidth;
  const viewportWidth = wrapper.offsetWidth;

  if (oneSetWidth === 0) return;

  // Enough copies so content fills viewport at any scroll position
  const copies = Math.max(2, Math.ceil((viewportWidth * 2) / oneSetWidth) + 1);
  el.innerHTML = Array(copies).fill(oneSet).join('');

  // GSAP infinite scroll — animate exactly one set width
  tickerBaseDuration = speedToDuration(tickerSpeed);
  gsap.set(el, { x: 0 });
  tickerTween = gsap.to(el, {
    x: -oneSetWidth,
    duration: tickerBaseDuration,
    ease: 'none',
    repeat: -1,
  });
}

function formatPrice(n) {
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function updateTickerPrices(newTickers) {
  newTickers.forEach(nt => {
    if (nt.price == null) return;
    const existing = activeTickers.find(t => t.symbol === nt.symbol);
    if (!existing) return;
    if (existing.price == nt.price && existing.change_pct == nt.change_pct) return;

    const oldPrice = Number(existing.price || 0);
    const newPrice = Number(nt.price);
    const oldPct = Number(existing.change_pct || 0);
    const newPct = Number(nt.change_pct || 0);

    existing.price = nt.price;
    existing.change_pct = nt.change_pct;

    document.querySelectorAll(`[data-ticker="${nt.symbol}"]`).forEach(el => {
      const priceEl = el.querySelector('.ticker-price');
      const changeEl = el.querySelector('.ticker-change');
      if (!priceEl || !changeEl) return;

      // Animate price number smoothly
      const proxy = { val: oldPrice };
      gsap.to(proxy, {
        val: newPrice,
        duration: 1,
        ease: 'power1.out',
        onUpdate: () => { priceEl.textContent = formatPrice(proxy.val); },
      });

      // Animate change % number smoothly
      const pctProxy = { val: oldPct };
      gsap.to(pctProxy, {
        val: newPct,
        duration: 1,
        ease: 'power1.out',
        onUpdate: () => {
          const arrow = pctProxy.val >= 0 ? '▲' : '▼';
          changeEl.textContent = `${arrow} ${Math.abs(pctProxy.val).toFixed(2)}%`;
        },
      });

      // Smooth color transition on direction change
      if ((oldPct >= 0) !== (newPct >= 0)) {
        gsap.to(changeEl, { color: newPct >= 0 ? '#22c55e' : '#ef4444', duration: 0.6, ease: 'power2.inOut' });
      }

      // Flash background on price change
      if (newPrice !== oldPrice) {
        const flashColor = newPrice > oldPrice ? 'rgba(34,197,94,0.25)' : 'rgba(239,68,68,0.25)';
        gsap.fromTo(priceEl,
          { backgroundColor: flashColor },
          { backgroundColor: 'transparent', duration: 1.5, ease: 'power2.out' }
        );
      }
    });
  });
}

function replaceTickersFade(newTickers) {
  fadeSwap('#tickerStrip', () => {
    activeTickers = newTickers;
    renderTickerTape();
  });
}

// ============================================================
// Footer
// ============================================================
function renderFooter() {
  document.getElementById('footerHashtag').textContent = footer.hashtag || '#PROACTIVEWIRE';

  const ctas = document.getElementById('footerCtas');
  ctas.innerHTML = Object.entries(CTA_CONFIG)
    .filter(([key]) => footer[key] !== false)
    .map(([, cfg], i, arr) => `<div class="footer-cta">
      <span class="footer-cta-text">${cfg.text}</span>
    </div>${i < arr.length - 1 ? '<span class="footer-cta-sep">·</span>' : ''}`).join('');
}

function updateFooter(newFooter) {
  const tl = gsap.timeline();
  tl.to('#footerHashtag', { opacity: 0, duration: 0.3, ease: 'power2.in' }, 0);
  tl.to('#footerCtas', { opacity: 0, duration: 0.3, ease: 'power2.in' }, 0);
  tl.call(() => { footer = newFooter; renderFooter(); });
  tl.to('#footerHashtag', { opacity: 1, duration: 0.3, ease: 'power2.out' });
  tl.to('#footerCtas', { opacity: 1, duration: 0.3, ease: 'power2.out' }, '<');
}

// ============================================================
// Initial load
// ============================================================
async function loadState() {
  try {
    const res = await fetch(`${CONFIG.apiBase}/overlay/state`);
    const data = await res.json();

    timezones = data.timezones;
    tickerSpeed = data.ticker_speed || 5;
    footer = data.footer || {};
    activeTickers = data.tickers || [];

    renderBackground(data.background || {});
    startClocks();
    renderTickerTape();
    renderFooter();
    MusicPlayer.init(data.music);
    // Note: content block is NOT loaded on init — overlay starts empty,
    // waiting for ContentBlockStarted event from admin

    // Entrance animation
    gsap.from('.top-bar', { y: -72, duration: 0.6, ease: 'power3.out' });
    gsap.from('#tickerStrip', { y: 80, duration: 0.6, ease: 'power3.out', delay: 0.2 });
    gsap.from('#footerBar', { y: 36, duration: 0.6, ease: 'power3.out', delay: 0.3 });
  } catch (e) {
    console.error('Failed to load overlay state:', e);
  }
}

// ============================================================
// WebSocket
// ============================================================
function connectWebSocket() {
  Pusher.logToConsole = true;

  const pusher = new Pusher(CONFIG.wsKey, {
    cluster: '',
    wsHost: CONFIG.wsHost,
    wsPort: CONFIG.wsPort,
    wssPort: CONFIG.wsPort,
    forceTLS: true,
    enabledTransports: ['ws', 'wss'],
    disableStats: true,
  });

  const channel = pusher.subscribe('wire.overlay');

  channel.bind('App\\Events\\BreakingNewsStarted', (data) => {
    showBreakingNews(data.headline);
  });

  channel.bind('App\\Events\\BreakingNewsStopped', () => {
    hideBreakingNews();
  });

  channel.bind('App\\Events\\TimezonesUpdated', (data) => {
    updateTimezones(data.timezones);
  });

  channel.bind('App\\Events\\SettingsUpdated', (data) => {
    if (data.settings.ticker_speed && data.settings.ticker_speed !== tickerSpeed) {
      tickerSpeed = data.settings.ticker_speed;

      if (tickerTween && tickerBaseDuration > 0) {
        const newTimeScale = tickerBaseDuration / speedToDuration(tickerSpeed);
        gsap.to(tickerTween, { timeScale: newTimeScale, duration: 2, ease: 'power2.inOut' });
      }
    }

    if (data.settings.background) {
      updateBackground(data.settings.background);
    }
  });

  channel.bind('App\\Events\\TickersUpdated', (data) => {
    updateTickerPrices(data.tickers);
  });

  channel.bind('App\\Events\\ContentBlockStarted', (data) => {
    console.log('ContentBlockStarted:', data);
    renderContentBlock(data.block);
  });

  channel.bind('App\\Events\\FooterUpdated', (data) => {
    updateFooter(data.footer);
  });

  channel.bind('App\\Events\\MusicLibraryUpdated', (data) => {
    MusicPlayer.reloadLibrary(data);
  });

  channel.bind('App\\Events\\MusicSettingsUpdated', (data) => {
    MusicPlayer.applySettings(data);
  });

  pusher.connection.bind('connected', () => {
    console.log('[WS] Connected');
  });
}

// ============================================================
// Scale overlay to fit viewport
// ============================================================
function scaleOverlay() {
  const root = document.getElementById('overlayRoot');
  const scaleX = window.innerWidth / 1920;
  const scaleY = window.innerHeight / 1080;
  const scale = Math.min(scaleX, scaleY);
  root.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

// --- SESSION BUG: closing of currently open market + next market to open ---
// Schedules in UTC, Mon-Fri. Markets covered by Proactive Investors:
// ASX (Sydney), LSE (London), TSX (Toronto), NYSE (New York).
const MARKETS = [
  { name: 'ASX',  openH: 0,  openM: 0,  closeH: 6,  closeM: 0  }, // Sydney  10:00-16:00 AEST
  { name: 'LSE',  openH: 7,  openM: 0,  closeH: 15, closeM: 30 }, // London  08:00-16:30 BST
  { name: 'TSX',  openH: 13, openM: 30, closeH: 20, closeM: 0  }, // Toronto 09:30-16:00 EDT
  { name: 'NYSE', openH: 13, openM: 30, closeH: 20, closeM: 0  }, // NY      09:30-16:00 EDT
];

function buildMarketIntervals() {
  // Generate (name, open, close) week-second intervals for Mon-Fri (day 1..5)
  const out = [];
  for (const m of MARKETS) {
    for (let d = 1; d <= 5; d++) {
      out.push({
        name:  m.name,
        open:  d * 86400 + m.openH * 3600 + m.openM * 60,
        close: d * 86400 + m.closeH * 3600 + m.closeM * 60,
      });
    }
  }
  return out;
}
const MARKET_INTERVALS = buildMarketIntervals();

function getMarketStatus() {
  const now = new Date();
  const nowWeek =
    now.getUTCDay() * 86400 +
    now.getUTCHours() * 3600 +
    now.getUTCMinutes() * 60 +
    now.getUTCSeconds();

  // Currently open (pick the one closing soonest)
  let closing = null;
  for (const iv of MARKET_INTERVALS) {
    if (nowWeek >= iv.open && nowWeek < iv.close) {
      const dt = iv.close - nowWeek;
      if (!closing || dt < closing.secondsTo) {
        closing = { name: iv.name, secondsTo: dt };
      }
    }
  }

  // Next to open (smallest forward delta to an open event, wrap to next week)
  let nextOpen = null;
  for (const iv of MARKET_INTERVALS) {
    let dt = iv.open - nowWeek;
    if (dt <= 0) dt += 7 * 86400;
    if (!nextOpen || dt < nextOpen.secondsTo) {
      nextOpen = { name: iv.name, secondsTo: dt };
    }
  }

  return { closing, nextOpen };
}

function fmtCountdown(sec) {
  const days = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (days > 0) return `${days}D ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function tickSessionBug() {
  const { closing, nextOpen } = getMarketStatus();
  const closingRow = document.getElementById('augBugRowClose');
  const labelClose = document.getElementById('augBugLabelClose');
  const timeClose  = document.getElementById('augBugTimeClose');
  const labelNext  = document.getElementById('augBugLabelNext');
  const timeNext   = document.getElementById('augBugTimeNext');

  if (closing) {
    closingRow.style.display = '';
    labelClose.textContent = `${closing.name} CLOSES IN`;
    timeClose.textContent  = fmtCountdown(closing.secondsTo);
  } else {
    closingRow.style.display = 'none';
  }

  if (nextOpen) {
    labelNext.textContent = `${nextOpen.name} OPENS IN`;
    timeNext.textContent  = fmtCountdown(nextOpen.secondsTo);
  }
}

function renderFearGreed(value) {
  const v = Math.max(0, Math.min(100, value));
  let label, color, bucket;
  if (v < 20)      { label = 'EXTREME FEAR';  color = '#ef4444'; bucket = 0; }
  else if (v < 40) { label = 'FEAR';          color = '#f97316'; bucket = 1; }
  else if (v < 60) { label = 'NEUTRAL';       color = '#facc15'; bucket = 2; }
  else if (v < 80) { label = 'GREED';         color = '#84cc16'; bucket = 3; }
  else             { label = 'EXTREME GREED'; color = '#22c55e'; bucket = 4; }

  const valueEl = document.getElementById('augFgValue');
  const labelEl = document.getElementById('augFgLabel');
  valueEl.textContent = v;
  labelEl.textContent = label;
  labelEl.style.color = color;

  document.getElementById('augFgMarker').style.left = `${v}%`;
  document.querySelectorAll('#augFg .aug-fg-bar-cell').forEach((cell, i) => {
    cell.classList.toggle('active', i === bucket);
  });
}

// Intro: animate video frame + lower-third in
function playIntro() {
  const tl = gsap.timeline();
  tl.fromTo('.video-frame',
    { opacity: 0, scale: 0.96 },
    { opacity: 1, scale: 1, duration: 0.6, ease: 'power3.out' }
  );

    { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' },

  );

// Outro: hide video frame + lower-third
function playOutro() {
  // Make sure music returns to normal even for iframe blocks
  // (where the <video> pause/ended listeners never fire).
  MusicPlayer.unduck();

  if (companyRotateInterval) { clearInterval(companyRotateInterval); companyRotateInterval = null; }
  if (durationTimer) { clearTimeout(durationTimer); durationTimer = null; }
  if (durationProgress) { clearInterval(durationProgress); durationProgress = null; }

  cancelVoiceScroll();

  const tl = gsap.timeline({
    onComplete: () => {
      const video = document.querySelector('.content-video');
      const iframe = document.getElementById('contentIframe');
      const audio = document.getElementById('contentAudio');
      const voiceTextInner = document.getElementById('voiceTextInner');
      const frame = document.querySelector('.video-frame');
      if (video) { video.pause(); video.currentTime = 0; }
      if (iframe) iframe.src = 'about:blank';
      if (audio) {
        audio.pause();
        audio.currentTime = 0;
        audio.ontimeupdate = null;
        audio.onended = null;
        audio.onloadedmetadata = null;
      }
      if (voiceTextInner) voiceTextInner.style.transform = 'translate3d(0, 0, 0)';
      frame.classList.remove('show-video', 'show-iframe', 'show-voice');
    },
  });
  tl.to('.lower-third', { opacity: 0, y: 30, duration: 0.4, ease: 'power3.in' });
  tl.to('.video-frame',
    { opacity: 0, scale: 0.96, duration: 0.5, ease: 'power3.in' },
    '-=0.3'
  );
}

function renderContentBlock(block) {
  // Iframe blocks have no <video> for Web Audio to listen to —
  // duck explicitly here. Video blocks are handled by the
  // play/pause/ended listeners attached to .content-video.
  MusicPlayer.duckForContentBlock(block);

  const titleEl = document.getElementById('ltTitle');
  if (titleEl) titleEl.textContent = block.article?.title || '';

  if (block.article?.url) setQrCode(block.article.url);

  // Companies
  if (companyRotateInterval) clearInterval(companyRotateInterval);
  currentCompanyIndex = 0;

  const companies = block.companies || [];
  if (companies.length) {
    renderCompanyMeta(companies[0]);

    if (companies.length > 1) {
      companyRotateInterval = setInterval(() => {
        const meta = document.getElementById('ltMeta');
        gsap.to(meta, {
          opacity: 0,
          y: -4,
          duration: 0.3,
          ease: 'power2.in',
          onComplete: () => {
            currentCompanyIndex = (currentCompanyIndex + 1) % companies.length;
            renderCompanyMeta(companies[currentCompanyIndex]);
            gsap.fromTo(meta,
              { opacity: 0, y: 4 },
              { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }
            );
          },
        });
      }, 6000);
    }
  }

  const frame = document.querySelector('.video-frame');
  const video = document.querySelector('.content-video');
  const iframe = document.getElementById('contentIframe');
  const audio = document.getElementById('contentAudio');
  const voiceCover = document.getElementById('voiceCover');
  const voiceTextInner = document.getElementById('voiceTextInner');
  const progressFill = document.getElementById('ltProgressFill');
  progressFill.style.width = '0%';

  // Reset everything
  frame.classList.remove('show-video', 'show-iframe', 'show-voice');
  video.pause();
  video.removeAttribute('src');
  iframe.src = 'about:blank';
  if (audio) {
    audio.pause();
    audio.removeAttribute('src');
    audio.ontimeupdate = null;
    audio.onended = null;
    audio.onloadedmetadata = null;
  }
  cancelVoiceScroll();
  if (voiceCover) voiceCover.removeAttribute('src');
  const voiceTextEl = document.getElementById('voiceText');
  if (voiceTextEl) voiceTextEl.style.removeProperty('--voice-cover-bg');
  if (voiceTextInner) {
    voiceTextInner.innerHTML = '';
    voiceTextInner.style.transform = 'translate3d(0, 0, 0)';
  }
  if (durationTimer) { clearTimeout(durationTimer); durationTimer = null; }
  if (durationProgress) { clearInterval(durationProgress); durationProgress = null; }

  // Load content based on type
  if (block.type === 'voice_block') {
    frame.classList.add('show-voice');

    if (voiceCover && block.cover?.url) {
      voiceCover.src = block.cover.url;
      // Use the cover as a heavily-blurred background for the text panel
      // so the colour palette is unified instead of a flat dark slab.
      const voiceText = document.getElementById('voiceText');
      if (voiceText) voiceText.style.setProperty('--voice-cover-bg', `url("${block.cover.url}")`);
    }

    // Render body text as paragraphs (split on blank lines)
    if (voiceTextInner && block.body) {
      const paragraphs = block.body
        .split(/\n\s*\n/)
        .map(p => p.trim())
        .filter(Boolean);
      voiceTextInner.innerHTML = paragraphs
        .map(p => `<p>${p.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</p>`)
        .join('');
    }

    audio.src = block.media.url;
    audio.load();

    audio.onloadedmetadata = () => {
      // Wait one frame so layout settles after innerHTML write.
      requestAnimationFrame(() => {
        const window = document.querySelector('.voice-text-window');
        const innerHeight = voiceTextInner.scrollHeight;
        const windowHeight = window.clientHeight;
        // The mask hides ~110px at the top and ~90px at the bottom.
        // Effective reading window is the middle band:
        const readableHeight = windowHeight - 110 - 90;
        const scrollMax = Math.max(0, innerHeight - readableHeight);
        // Start with the first line just below the top fade so it scrolls in.
        voiceTextInner.style.top = '110px';

        // Drive scroll from requestAnimationFrame (~60Hz) instead of
        // audio.ontimeupdate (~4Hz) — otherwise the text teleports in
        // 250ms steps. We read audio.currentTime live each frame.
        cancelVoiceScroll();
        const tick = () => {
          if (!audio.duration || !isFinite(audio.duration)) {
            voiceScrollRaf = requestAnimationFrame(tick);
            return;
          }
          progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
          // Map currentTime → 0..scrollMax over the first 95% of playback,
          // so the text settles slightly before the audio actually ends.
          const progress = Math.min(1, audio.currentTime / (audio.duration * 0.95));
          voiceTextInner.style.transform = `translate3d(0, ${-progress * scrollMax}px, 0)`;
          voiceScrollRaf = requestAnimationFrame(tick);
        };
        voiceScrollRaf = requestAnimationFrame(tick);
      });
    };

    audio.onended = () => playOutro();
    audio.play().catch(err => console.warn('Voice audio play failed:', err));
  } else if (block.media?.url) {
    frame.classList.add('show-video');
    const source = video.querySelector('source');
    source.src = block.media.url;
    video.load();
    video.onended = () => playOutro();
    video.ontimeupdate = () => {
      if (video.duration > 0) {
        progressFill.style.width = (video.currentTime / video.duration * 100) + '%';
      }
    };
    video.play().catch(err => console.warn('Video play failed:', err));
  } else if (block.embed?.url) {
    frame.classList.add('show-iframe');
    iframe.src = block.embed.url;

    // Iframe lifecycle controlled by duration_sec
    const duration = (block.duration_sec || 60) * 1000;
    const startTime = Date.now();

    durationProgress = setInterval(() => {
      const elapsed = Date.now() - startTime;
      progressFill.style.width = Math.min(elapsed / duration * 100, 100) + '%';
    }, 100);

    durationTimer = setTimeout(() => {
      clearInterval(durationProgress);
      durationProgress = null;
      playOutro();
    }, duration);
  }

  // Intro animation
  playIntro();
}

// ============================================================
// Background pattern
// ============================================================
let bgConfig = {};

function renderBackground(config) {
  bgConfig = config || {};
  const container = document.getElementById('bgPattern');
  const root = document.getElementById('overlayRoot');

  if (!bgConfig.enabled) {
    container.innerHTML = '';
    root.style.background = bgConfig.bg_color || '#1a1a1e';
    return;
  }

  root.style.background = bgConfig.bg_color || '#1a1a1e';

  const text = bgConfig.text || 'PROACTIVE INVESTORS';
  const angle = bgConfig.angle ?? 25;
  const textColor = bgConfig.text_color || '#ffffff';
  const opacity = (bgConfig.text_opacity ?? 3) / 100;
  const fontSize = bgConfig.font_size || 48;
  // 1=stopped, 2-10 = 500s down to 100s
  const speedLevel = bgConfig.speed || 5;
  const speed = speedLevel <= 1 ? 0 : Math.round(560 - (speedLevel * 50));
  const direction = bgConfig.direction || 'up-left';

  // Direction mapping:
  // rotate(-angle) + scroll left  = ↖ up-left
  // rotate(-angle) + scroll right = ↘ down-right
  // rotate(+angle) + scroll left  = ↙ down-left
  // rotate(+angle) + scroll right = ↗ up-right
  const isUp = direction.includes('up');
  const isLeft = direction.includes('left');
  const rotSign = (isLeft === isUp) ? 1 : -1;

  const rowHeight = fontSize * 1.6;
  const rows = 40;

  // Build one set of text spans
  const oneSet = Array(10).fill(
    `<span class="bg-pattern-text" style="font-size:${fontSize}px;color:${textColor};opacity:${opacity}">${text}</span>`
  ).join('');

  let html = '';
  for (let i = 0; i < rows; i++) {
    // Scroll: left dirs = default, right dirs = reverse. Alternate flips odd rows.
    const alternate = bgConfig.alternate_rows && (i % 2 === 1);
    const shouldReverse = isLeft ? alternate : !alternate;
    const reverseRow = shouldReverse ? ' reverse' : '';
    const offset = (i % 2 === 0) ? 0 : fontSize * 4;
    html += `<div class="bg-pattern-row" style="height:${rowHeight}px">`;
    const animStyle = speed > 0 ? `--bg-speed:${speed}s` : 'animation:none';
    html += `<div class="bg-pattern-scroll${reverseRow}" style="${animStyle};padding-left:${offset}px">`;
    html += oneSet + oneSet;
    html += `</div></div>`;
  }

  container.innerHTML = html;
  container.style.transform = `rotate(${rotSign * angle}deg)`;
}

// ---- Background transition effects ----
const bgTransitions = {

  // 1. Dissolve — random scatter fade
  dissolve(spans, done) {
    gsap.to(spans, {
      opacity: 0,
      duration: 0.3,
      stagger: { each: 0.005, from: 'random' },
      onComplete: done,
    });
  },
  dissolveIn(spans, targetOpacity) {
    gsap.fromTo(spans,
      { opacity: 0 },
      { opacity: targetOpacity, duration: 0.4, stagger: { each: 0.005, from: 'random' } }
    );
  },

  // 2. Typewriter — left to right reveal
  typewriter(spans, done) {
    gsap.to(spans, {
      opacity: 0,
      duration: 0.2,
      stagger: { each: 0.003, from: 'start' },
      onComplete: done,
    });
  },
  typewriterIn(spans, targetOpacity) {
    gsap.fromTo(spans,
      { opacity: 0 },
      { opacity: targetOpacity, duration: 0.2, stagger: { each: 0.003, from: 'start' } }
    );
  },

  // 3. Cascade — top to bottom rows
  cascade(spans, done) {
    gsap.to(spans, {
      opacity: 0,
      y: -20,
      duration: 0.4,
      stagger: { each: 0.008, from: 'start' },
      onComplete: done,
    });
  },
  cascadeIn(spans, targetOpacity) {
    gsap.fromTo(spans,
      { opacity: 0, y: 20 },
      { opacity: targetOpacity, y: 0, duration: 0.4, stagger: { each: 0.008, from: 'start' } }
    );
  },

  // 4. Glitch — digital flicker
  glitch(spans, done) {
    gsap.to(spans, {
      opacity: 0,
      duration: 0.15,
      stagger: { each: 0.001, from: 'random', repeat: 2, yoyo: true },
      onComplete: done,
    });
  },
  glitchIn(spans, targetOpacity) {
    gsap.fromTo(spans,
      { opacity: 0 },
      { opacity: targetOpacity, duration: 0.15, stagger: { each: 0.001, from: 'random', repeat: 2, yoyo: true } }
    );
  },

  // 5. Blinds — rows collapse like shutters
  blinds(spans, done) {
    const rows = document.querySelectorAll('.bg-pattern-row');
    gsap.to(rows, {
      scaleY: 0,
      opacity: 0,
      duration: 0.3,
      stagger: { each: 0.02, from: 'edges' },
      onComplete: done,
    });
  },
  blindsIn(spans, targetOpacity) {
    const rows = document.querySelectorAll('.bg-pattern-row');
    gsap.fromTo(rows,
      { scaleY: 0, opacity: 0 },
      { scaleY: 1, opacity: 1, duration: 0.3, stagger: { each: 0.02, from: 'edges' } }
    );
  },
};

function updateBackground(config) {
  const container = document.getElementById('bgPattern');
  const spans = container.querySelectorAll('.bg-pattern-text');
  const newText = config.text || bgConfig.text || 'PROACTIVE INVESTORS';
  const textChanged = newText !== (bgConfig.text || '');
  const effect = config.transition || bgConfig.transition || 'wave';
  const targetOpacity = (config.text_opacity ?? bgConfig.text_opacity ?? 3) / 100;

  // Smooth background color transition always
  gsap.to(document.getElementById('overlayRoot'), {
    backgroundColor: config.bg_color || '#1a1a1e',
    duration: 1.5,
    ease: 'power2.inOut',
  });

  if (spans.length > 0) {
    const outFn = bgTransitions[effect] || bgTransitions.dissolve;
    const inFn = bgTransitions[effect + 'In'] || bgTransitions.dissolveIn;

    outFn(spans, () => {
      renderBackground(config);
      const newSpans = container.querySelectorAll('.bg-pattern-text');
      inFn(newSpans, targetOpacity);
    });
  } else {
    renderBackground(config);
  }
}

// ============================================================
// Background music player
// ----------------------------------------------------------------
// Two-deck Web Audio engine. Plays the active album's tracks
// sequentially with crossfade. Listens for ContentBlockStarted
// (and the underlying <video>'s play/pause/ended) to duck music
// during news/content playback.
// ============================================================
const MusicPlayer = {
  cfg: {
    enabled: true,
    volume: 0.6,         // 0..1
    volumeDucked: 0.15,  // 0..1
    crossfadeSec: 4,
    attackTau: 0.08,     // setTargetAtTime time-constant — ducking
    releaseTau: 0.5,     // setTargetAtTime time-constant — release
  },
  tracks: [],
  currentIndex: -1,
  isDucked: false,
  ctx: null,
  decks: [null, null],
  active: 0,
  contentVideoAttached: false,

  ensureCtx() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();

    for (let i = 0; i < 2; i++) {
      const audio = new Audio();
      audio.crossOrigin = 'anonymous';
      audio.preload = 'auto';
      // Prevent the element from outputting twice — Web Audio handles it.
      const src = this.ctx.createMediaElementSource(audio);
      const hp = this.ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 180;
      const gain = this.ctx.createGain();
      gain.gain.value = 0;
      src.connect(hp).connect(gain).connect(this.ctx.destination);
      this.decks[i] = { audio, gain, crossfading: false, tickHandler: null };
    }

    this.attachContentVideo();
  },

  attachContentVideo() {
    if (this.contentVideoAttached) return;
    const videoEl = document.querySelector('.content-video');
    const audioEl = document.querySelector('.content-audio');
    if (!videoEl) return;

    // Defensive: a muted MediaElementSource produces silence per spec.
    videoEl.muted = false;
    videoEl.volume = 1.0;
    if (audioEl) { audioEl.muted = false; audioEl.volume = 1.0; }

    // Shared compressor — voice/news content benefits from gentle compression.
    let comp;
    try {
      comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -20;
      comp.ratio.value = 3;
      comp.attack.value = 0.01;
      comp.release.value = 0.15;
      comp.connect(this.ctx.destination);
    } catch (e) {
      console.warn('[Music] could not create content compressor:', e?.message);
    }

    try {
      const vsrc = this.ctx.createMediaElementSource(videoEl);
      vsrc.connect(comp || this.ctx.destination);
    } catch (e) {
      console.warn('[Music] content-video already attached:', e?.message);
    }

    if (audioEl) {
      try {
        const asrc = this.ctx.createMediaElementSource(audioEl);
        asrc.connect(comp || this.ctx.destination);
      } catch (e) {
        console.warn('[Music] content-audio already attached:', e?.message);
      }

      audioEl.addEventListener('play',  () => this.duck());
      audioEl.addEventListener('ended', () => this.unduck());
      audioEl.addEventListener('pause', () => this.unduck());
    }

    videoEl.addEventListener('play',  () => this.duck());
    videoEl.addEventListener('ended', () => this.unduck());
    videoEl.addEventListener('pause', () => this.unduck());
    this.contentVideoAttached = true;
  },

  init(musicState) {
    if (!musicState) return;
    this.cfg.enabled       = !!musicState.enabled;
    this.cfg.volume        = (musicState.volume ?? 60) / 100;
    this.cfg.volumeDucked  = (musicState.volume_ducked ?? 15) / 100;
    this.cfg.crossfadeSec  = musicState.crossfade_sec ?? 4;
    this.tracks = musicState.active_album?.tracks ?? [];

    if (!this.cfg.enabled || !this.tracks.length) return;
    this.start();
  },

  targetVolume() {
    if (!this.cfg.enabled) return 0;
    return this.isDucked ? this.cfg.volumeDucked : this.cfg.volume;
  },

  start() {
    this.ensureCtx();
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    this.currentIndex = 0;
    this.playOnDeck(this.active, this.tracks[0], /*fadeIn*/ true);
    this.scheduleCrossfade(this.active);
  },

  stop() {
    for (const d of this.decks) {
      if (!d) continue;
      const t = this.ctx.currentTime;
      d.gain.gain.cancelScheduledValues(t);
      d.gain.gain.setTargetAtTime(0, t, this.cfg.releaseTau);
      d.crossfading = false;
      if (d.tickHandler) {
        d.audio.removeEventListener('timeupdate', d.tickHandler);
        d.tickHandler = null;
      }
      setTimeout(() => { try { d.audio.pause(); } catch (e) {} }, 1500);
    }
  },

  playOnDeck(deckIdx, track, fadeIn) {
    const deck = this.decks[deckIdx];
    deck.audio.src = track.url;
    const t = this.ctx.currentTime;
    deck.gain.gain.cancelScheduledValues(t);
    deck.gain.gain.setValueAtTime(0, t);
    deck.audio.play().catch(e => console.warn('[Music] play failed', e));
    if (fadeIn) {
      deck.gain.gain.linearRampToValueAtTime(this.targetVolume(), t + this.cfg.crossfadeSec);
    } else {
      deck.gain.gain.setValueAtTime(this.targetVolume(), t);
    }
  },

  scheduleCrossfade(deckIdx) {
    const deck = this.decks[deckIdx];
    if (deck.tickHandler) deck.audio.removeEventListener('timeupdate', deck.tickHandler);

    deck.tickHandler = () => {
      if (!deck.audio.duration || deck.crossfading) return;
      const remaining = deck.audio.duration - deck.audio.currentTime;
      if (remaining <= this.cfg.crossfadeSec) {
        deck.crossfading = true;
        this.crossfadeToNext();
      }
    };
    deck.audio.addEventListener('timeupdate', deck.tickHandler);
  },

  crossfadeToNext() {
    if (!this.tracks.length) return;
    const oldIdx = this.active;
    const newIdx = 1 - oldIdx;
    const oldDeck = this.decks[oldIdx];
    const newDeck = this.decks[newIdx];
    const t = this.ctx.currentTime;
    const target = this.targetVolume();

    this.currentIndex = (this.currentIndex + 1) % this.tracks.length;
    const nextTrack = this.tracks[this.currentIndex];

    newDeck.audio.src = nextTrack.url;
    newDeck.gain.gain.cancelScheduledValues(t);
    newDeck.gain.gain.setValueAtTime(0, t);
    newDeck.audio.play().catch(e => console.warn('[Music] play failed', e));
    newDeck.gain.gain.linearRampToValueAtTime(target, t + this.cfg.crossfadeSec);

    oldDeck.gain.gain.cancelScheduledValues(t);
    oldDeck.gain.gain.linearRampToValueAtTime(0, t + this.cfg.crossfadeSec);

    setTimeout(() => {
      try { oldDeck.audio.pause(); } catch (e) {}
      oldDeck.crossfading = false;
      if (oldDeck.tickHandler) {
        oldDeck.audio.removeEventListener('timeupdate', oldDeck.tickHandler);
        oldDeck.tickHandler = null;
      }
    }, this.cfg.crossfadeSec * 1000 + 200);

    this.active = newIdx;
    this.scheduleCrossfade(newIdx);
  },

  rampActiveTo(value, tau) {
    const deck = this.decks[this.active];
    if (!deck) return;
    const t = this.ctx.currentTime;
    deck.gain.gain.cancelScheduledValues(t);
    deck.gain.gain.setTargetAtTime(value, t, tau);
  },

  duck() {
    if (this.isDucked) return;
    this.isDucked = true;
    if (!this.ctx) return;
    this.rampActiveTo(this.targetVolume(), this.cfg.attackTau);
  },

  unduck() {
    if (!this.isDucked) return;
    this.isDucked = false;
    if (!this.ctx) return;
    this.rampActiveTo(this.targetVolume(), this.cfg.releaseTau);
  },

  applySettings(s) {
    const wasEnabled = this.cfg.enabled;
    this.cfg.enabled       = !!s.enabled;
    this.cfg.volume        = (s.volume ?? 60) / 100;
    this.cfg.volumeDucked  = (s.volume_ducked ?? 15) / 100;
    this.cfg.crossfadeSec  = s.crossfade_sec ?? 4;

    if (!this.cfg.enabled) {
      this.rampActiveTo(0, this.cfg.releaseTau);
      return;
    }

    if (!wasEnabled && this.tracks.length && this.currentIndex < 0) {
      this.start();
    } else {
      this.rampActiveTo(this.targetVolume(), this.cfg.releaseTau);
    }
  },

  reloadLibrary(payload) {
    const tracks = payload?.active_album?.tracks ?? [];
    this.tracks = tracks;

    if (!tracks.length) {
      this.stop();
      this.currentIndex = -1;
      return;
    }

    // Smooth handover: fade-out current, then start fresh from track 0.
    if (this.ctx) {
      const t = this.ctx.currentTime;
      for (const d of this.decks) {
        if (!d) continue;
        d.gain.gain.cancelScheduledValues(t);
        d.gain.gain.linearRampToValueAtTime(0, t + 0.6);
        d.crossfading = false;
        if (d.tickHandler) {
          d.audio.removeEventListener('timeupdate', d.tickHandler);
          d.tickHandler = null;
        }
      }
      setTimeout(() => {
        for (const d of this.decks) { try { d.audio.pause(); } catch (e) {} }
        this.currentIndex = -1;
        this.active = 0;
        if (this.cfg.enabled) this.start();
      }, 700);
    } else if (this.cfg.enabled) {
      this.start();
    }
  },

  // Fallback ducking hook for content blocks where the <video>/<audio>
  // play event might fire too late (or never, e.g. iframe embeds).
  duckForContentBlock(block) {
    if (block?.embed?.url || block?.type === 'voice_block') this.duck();
  },
};

// One-time gesture unlock for browsers that block AudioContext until interaction
// (OBS Browser Source allows autoplay by default, so this is a graceful fallback).
window.addEventListener('click', () => {
  if (MusicPlayer.ctx && MusicPlayer.ctx.state === 'suspended') {
    MusicPlayer.ctx.resume().catch(() => {});
  }
}, { once: false });
